[project]
name = "artefact"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepeval==4.3.3",
    "fastapi>=0.162.2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "openai>=3.46.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
